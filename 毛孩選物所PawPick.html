const tb=[['sales','📊 銷售分析'],['orders','📦 訂單管理'],['stock','🏷️ 商品與庫存']];
return `<div class="wrap sec"><h1>後台管理</h1><p class="note">示範後台:資料為 45 筆模擬訂單加上你在本機下的訂單;權限僅在前端判斷,不具真實安全性,正式上線需後端驗證。</p><div class="chips" style="margin-top:14px">${tb.map(([k,t])=>`<button class="chip" data-act="aTab" data-k="${k}" aria-pressed="${at===k}">${t}</button>`).join('')}</div>${at==='sales'?sales():at==='orders'?aord():astk()}</div>`}
function sales(){const t0=T0(),os=allO().filter(o=>stt(o)!=='已取消'&&o.ts>=t0-(rng-1)*864e5),ln=i=>(i.pr||P.find(p=>p.id==i.id).price)*i.n,rev=os.reduce((s,o)=>s+o.total,0),qty=os.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.n,0),0);

return `<div class="chips">${[7,14,30].map(n=>`<button class="chip" data-act="aRng" data-k="${n}" aria-pressed="${rng===n}">近 ${n} 日</button>`).join('')}</div><div class="kpi">${kp.map(([t,v])=>`<div class="pn"><small class="mut">${t}</small><h2>${v}</h2></div>`).join('')}</div>
<div class="pn" style="margin-top:14px"><h3>每日營收</h3><div class="bars" role="img" aria-label="近 ${rng} 日每日營收長條圖,單日最高 ${money(mx)}">${days.map(d=>`<div class="bar" title="${d.l}:${money(d.v)}"><i style="height:${d.v/mx*85}%"></i><small>${rng<=14?d.l:''}</small></div>`).join('')}</div></div>
<div class="c3" style="margin-top:14px"><div class="pn"><h3>分類營收占比</h3>${cs.map(([k,v])=>`<div style="margin:10px 0"><div class="tot"><span>${CATS[k]}</span><span>${money(v)}(${Math.round(v/cT*100)}%)</span></div><div class="meter"><i style="width:${v/cm*100}%"></i></div></div>`).join('')||'<p class="mut">尚無資料</p>'}</div>
<div class="pn"><h3>熱銷商品 Top 5</h3>${tp.map(({p,n,v},i)=>`<div class="row"><a href="#/p/${p.id}">${i+1}. ${p.em} ${p.name}</a><b>${n} 件・${money(v)}</b></div>`).join('')||'<p class="mut">尚無資料</p>'}</div>
<div class="pn"><h3>⚠️ 低庫存警示</h3>${low.map(p=>`<div class="row"><span>${p.em} ${p.name}</span><b>${p.stock?'剩 '+p.stock+' 件':'缺貨'}</b></div>`).join('')||'<p class="mut">庫存充足</p>'}<button class="btn sm sec2" style="margin-top:10px" data-act="aTab" data-k="stock">前往調整庫存</button></div></div>`}
function aord(){const os=allO().sort((a,b)=>b.ts-a.ts).slice(0,25);return `<div class="pn tw" style="margin-top:14px"><table><tr><th>訂單</th><th>日期</th><th>件數</th><th>金額</th><th>狀態</th></tr>${os.map(o=>`<tr><td>${o.id}${o.seed?'':' <small class="ok">(本機)</small>'}</td><td>${new Date(o.ts).toLocaleDateString('zh-TW')}</td><td>${o.items.reduce((a,i)=>a+i.n,0)}</td><td>${money(o.total)}</td><td><select data-oid="${o.id}" aria-label="訂單 ${o.id} 狀態">${['待出貨','已出貨','已完成','已取消'].map(s=>`<option ${s===stt(o)?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table><p class="mut">僅顯示最近 25 筆。已取消的訂單不計入銷售分析。</p></div>`}

const V={'':home,list,p:pd,cart,checkout,done,pets,member,support,admin};

function add(id,n=1){const p=P.find(x=>x.id==id),cap=Math.min(p.stock,10),c=S.cart[id]||0;if(c>=cap)return toast('已達庫存上限');S.cart[id]=Math.min(c+n,cap);save();$('#cb').textContent=count();toast('已加入購物車:'+p.name)}
function setQ(k,v){const q=route().q;v?q.set(k,v):q.delete(k);const s=q.toString();location.hash='#/list'+(s?'?'+s:'')}
const ACT={
fav(t,id){const i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();const on=i<0;document.querySelectorAll(`[data-act=fav][data-id="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',on);b.textContent=b.classList.contains('fav')?(on?'♥':'♡'):(on?'♥ 已收藏':'♡ 收藏')});toast(on?'已加入收藏':'已取消收藏');if(route().seg[0]==='member')render()},
add:(t,id)=>add(id),addq:(t,id)=>add(id,+$('#qty').value),
inc(t,id){add(id);render()},dec(t,id){S.cart[id]=Math.max(1,(S.cart[id]||1)-1);save();render()},rm(t,id){delete S.cart[id];save();render();toast('已移除商品')},
flt:t=>setQ(t.dataset.k,t.dataset.v),menu(){menu=!menu;render()},ann(){annOff=true;render()},back(){history.length>1?history.back():location.hash='#/list'},demo:()=>toast('示範連結:尚未串接真實社群帳號'),

goAssist(){if(!route().seg.length)$('#assist-sec').scrollIntoView({behavior:'smooth'});else{pend='assist';location.hash='#/'}},

petEdit(t,id){editPet=id;render()},petCancel(){editPet=null;render()},petDel(t,id){S.pets=S.pets.filter(x=>x.id!==id);save();render();toast('已刪除')},

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t,+t.dataset.id)});
document.addEventListener('change',e=>{const o=e.target.closest('select[data-oid]');if(o){S.ost[o.dataset.oid]=o.value;save();render();toast('訂單狀態已更新');return}const t=e.target.closest('select[data-k]');if(t){fk=t.dataset.k;setQ(t.dataset.k,t.value)}});
const R={req:[v=>v.length>0,'此欄位必填'],mail:[v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),'請輸入有效的 Email'],tel:[v=>/^09\d{8}$/.test(v),'請輸入 09 開頭的 10 碼手機號碼'],pw:[v=>v.length>=6,'密碼至少 6 碼'],msg:[v=>v.length>=10,'請至少輸入 10 個字']};
function chk(f,rules){let ok=true,first;for(const k in rules){const el=f.querySelector(`[name=${k}]`),er=f.querySelector(`[data-e=${k}]`),bad=!rules[k][0](el.value.trim());if(er)er.textContent=bad?rules[k][1]:'';el.setAttribute('aria-invalid',bad);if(bad){ok=false;first=first||el}}first&&first.focus();return ok}
